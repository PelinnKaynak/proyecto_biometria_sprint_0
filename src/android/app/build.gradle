plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pelinkaynak.biometria'
    compileSdk 33

    defaultConfig {
        applicationId "com.pelinkaynak.biometria"
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Lógica del negocio del cliente (componente src/client_business_logic,
    // diseño en doc/client_business_logic_design.md)
    sourceSets {
        main { java.srcDirs += ['../../client_business_logic/java'] }
        test { java.srcDirs += ['../../client_business_logic/test/java'] }
    }
}

dependencies {

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}